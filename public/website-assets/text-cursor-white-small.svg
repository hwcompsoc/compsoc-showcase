<svg xmlns="http://www.w3.org/2000/svg" width="17" height="32" viewBox="0 0 108 207" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">HW CompSoc text cursor</title>
  <desc id="desc">A pixel-style I-beam text-selection cursor with stepped serifs, a deep blue stem, and one cyan accent pixel on a transparent background.</desc>
