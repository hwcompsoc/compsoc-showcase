             M60 28V132H42V119H29V106H16V119H29V145H42V158H55V171H68V192H119V171H132V145H145V119H132V106H119V93H94V80H76V28Z" fill-rule="evenodd"/>
    <path d="M76 81H89V119H76ZM102 94H115V132H102ZM128 120H141V133H128Z"/>
  </g>
  <g fill="#00A1CC">
    <path d="M145 160H158V173H145Z"/>
