<svg xmlns="http://www.w3.org/2000/svg" width="25" height="32" viewBox="0 0 160 207" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">HW CompSoc active pointer cursor</title>
  <desc id="desc">A pressed-state test of the CompSoc pointing hand, with a lowered fingertip and three cyan pixel click marks on a transparent background.</desc>
  <!-- Keep the palm and wrist registered to the original pointer;
       compress the index finger by one 13-unit step when pressed. -->
  <g fill="#004066">
